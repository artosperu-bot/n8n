name: Apply approved commercial root fixes

on:
  push:
    branches:
      - qa/live-10-20260831
    paths:
      - .github/workflows/_apply-commercial-root-fix-2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-conversation-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded root fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once(
            'backend/src/conversation/nba/NextBestAction.ts',
            "export function nextBestAction(intent: string, state: ConversationState = {}): string | null {",
            """export function canAdvanceFulfillment(state: ConversationState = {}): boolean {
  const resolvedProduct=Boolean(state.activeProduct||state.selectedProduct||state.recommendedProduct);
  if(!resolvedProduct)return false;
  if(state.purchaseSignal===true||Boolean(state.reservationStage))return true;
  const pending=String(state.pendingCommercialAction??state.lastNba??'').toUpperCase();
  const stage=String(state.commercialStage??'').toUpperCase();
  return pending==='SOFT_CLOSE'||['CIERRE','CIERRE_ASISTIDO'].includes(stage);
}

export function nextBestAction(intent: string, state: ConversationState = {}): string | null {"""
          )
          replace_once(
            'backend/src/conversation/nba/NextBestAction.ts',
            """    case 'FULFILLMENT_SELECTION':
      return resolvedProduct ? 'SOFT_CLOSE' : 'ANSWER_ONLY';""",
            """    case 'FULFILLMENT_SELECTION':
      return canAdvanceFulfillment(state) ? 'SOFT_CLOSE' : 'ANSWER_ONLY';"""
          )

          replace_once(
            'backend/src/conversation/decision/DecisionValidator.ts',
            "import { nextBestAction as deterministicNextBestAction } from '../nba/NextBestAction.ts';",
            "import { canAdvanceFulfillment, nextBestAction as deterministicNextBestAction } from '../nba/NextBestAction.ts';"
          )
          replace_once(
            'backend/src/conversation/decision/DecisionValidator.ts',
            """  const plannerIntent=canonicalIntent(decision.primaryIntent);
  let primaryIntent=plannerIntent??fallbackIntent??'OTHER';

  if(fallbackIntent&&['OBJECTION','HANDLE_PRICE_OBJECTION'].includes(fallbackIntent)&&['OBJECTION','HANDLE_PRICE_OBJECTION'].includes(primaryIntent))primaryIntent=fallbackIntent;""",
            """  const plannerIntent=canonicalIntent(decision.primaryIntent);
  let primaryIntent=plannerIntent??fallbackIntent??'OTHER';

  if(fallbackIntent==='FULFILLMENT_SELECTION'){
    const previousIntent=canonicalIntent(state.lastIntent);
    const resumableDiscoveryIntent=previousIntent&&[
      'EVALUATE_USE','PRODUCT_INFO','RECOMMEND','RECOMMEND_WITHIN_BUDGET',
      'BUDGET_CONSTRAINT','OBJECTION','HANDLE_PRICE_OBJECTION',
    ].includes(previousIntent)?previousIntent:null;
    primaryIntent=canAdvanceFulfillment(state)?'FULFILLMENT_SELECTION':(resumableDiscoveryIntent??'OTHER');
  }
  if(fallbackIntent&&['OBJECTION','HANDLE_PRICE_OBJECTION'].includes(fallbackIntent)&&['OBJECTION','HANDLE_PRICE_OBJECTION'].includes(primaryIntent))primaryIntent=fallbackIntent;"""
          )

          replace_once(
            'backend/src/conversation/commercial/FullRagLlmProvider.ts',
            """function policyResumeResponse(input:LlmWriteInput,core:string):string{return[compactPolicyCore(input,core),softCloseQuestion(input)].filter(Boolean).join(' ').trim();}
function naturalFallback(input:LlmWriteInput,core:string):string{
  const lead=currentMessagePain(input.message);
  const question=input.commercialResponsePlan?.exactNba==='SOFT_CLOSE'?softCloseQuestion(input):'';
  return [lead,core,question].filter(Boolean).join(' ').trim();
}""",
            """function policyResumeResponse(input:LlmWriteInput,core:string):string{return[compactPolicyCore(input,core),softCloseQuestion(input)].filter(Boolean).join(' ').trim();}
function missingFactQuestion(input:LlmWriteInput):string{
  const missing=fold(input.missingFact??input.pendingQuestion??input.state?.pendingMissingFact??'');
  const context=fold(`${input.message} ${input.useCase??input.state?.useCase??''} ${input.problem??input.state?.problem??''}`);
  if(/impacto|implicacion|consecuencia/.test(missing)){
    if(/caida|golpe|repar/.test(context))return'¿Y cuando pasa, qué te afecta más: que se dañe o que te haga perder tiempo en el trabajo?';
    if(/bateria|cargador|autonomia/.test(context))return'¿Y cuando te quedas sin batería, qué es lo que más te complica durante la jornada?';
    if(/polvo|lluvia|agua|humedad/.test(context))return'¿Y cuando eso pasa, qué consecuencia te genera durante el trabajo?';
    return'¿Y qué consecuencia te genera eso en el día a día?';
  }
  if(/problema/.test(missing))return'¿Qué es lo que más te complica con tu celular actual?';
  if(/prioridad|criterio/.test(missing))return'¿Qué sería lo más importante para ti al elegir el equipo?';
  if(/presupuesto|tope/.test(missing))return'¿Cuál es tu presupuesto máximo?';
  if(/modelo|producto/.test(missing))return'¿Qué modelo estás viendo?';
  if(/uso/.test(missing))return'¿Para qué lo usarías principalmente?';
  return'';
}
function naturalFallback(input:LlmWriteInput,core:string):string{
  const lead=currentMessagePain(input.message);
  const nba=String(input.commercialResponsePlan?.exactNba??input.finalExecutableNba??input.nextBestAction??'').toUpperCase();
  const question=nba==='SOFT_CLOSE'?softCloseQuestion(input):nba==='ASK_MISSING_FACT'?missingFactQuestion(input):'';
  return [lead,core,question].filter(Boolean).join(' ').trim();
}"""
          )
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Focused root regressions
        working-directory: backend
        run: node --experimental-strip-types --test tests/unit/live-commercial-root-regressions.test.ts
      - name: Existing salesperson regressions
        working-directory: backend
        run: node --experimental-strip-types --test tests/unit/commercial-salesperson-regressions.test.ts
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Commit approved fixes to canonical branch
        run: |
          git config user.name "artosperu-bot"
          git config user.email "artosperu@gmail.com"
          git add backend/src/conversation/nba/NextBestAction.ts backend/src/conversation/decision/DecisionValidator.ts backend/src/conversation/commercial/FullRagLlmProvider.ts
          git commit -m "fix: preserve discovery and fulfillment continuity"
          git push origin HEAD:refactor/canonical-conversation-state
