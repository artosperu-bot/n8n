name: QA P0 n8n acquire contract probe

on:
  push:
    branches:
      - p0-concurrency-hardening
    paths:
      - .github/workflows/qa-p0-n8n-contract-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      N8N_BASE: https://stechsito.app.n8n.cloud
    steps:
      - name: Probe live workflow node and execution 3401
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${N8N_API_KEY:-}" ]; then
            echo 'N8N_API_KEY_MISSING'
            exit 2
          fi

          wf=$(mktemp)
          ex=$(mktemp)
          wf_code=$(curl -sS -o "$wf" -w '%{http_code}' \
            -H "X-N8N-API-KEY: ${N8N_API_KEY}" \
            "${N8N_BASE}/api/v1/workflows/c661Gw0xoqZBsNtf")
          echo "WORKFLOW_HTTP=${wf_code}"
          if [ "$wf_code" != "200" ]; then
            jq -c '{message,code}' "$wf" 2>/dev/null || cat "$wf"
            exit 3
          fi

          jq -c '{id,name,active,versionId,updatedAt,node:(.nodes[]|select(.name=="22 Asegurar Sesión")|{name,type,typeVersion,parameters,credentials:(.credentials//{}|with_entries(.value={name:.value.name}))})}' "$wf"

          ex_code=$(curl -sS -o "$ex" -w '%{http_code}' \
            -H "X-N8N-API-KEY: ${N8N_API_KEY}" \
            "${N8N_BASE}/api/v1/executions/3401?includeData=true")
          echo "EXECUTION_HTTP=${ex_code}"
          if [ "$ex_code" != "200" ]; then
            jq -c '{message,code}' "$ex" 2>/dev/null || cat "$ex"
            exit 4
          fi

          jq -c '{id,status,mode,startedAt,stoppedAt,run:(.data.resultData.runData["22 Asegurar Sesión"]//[]|map({startTime,executionTime,source,error:(if .error then {name:.error.name,message:.error.message,description:.error.description,httpCode:.error.httpCode,cause:.error.cause} else null end),output:(.data.main[0]//[]|map(.json))}))}' "$ex"
