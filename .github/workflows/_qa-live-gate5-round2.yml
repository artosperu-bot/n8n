name: QA live gate5 round2

on:
  push:
    branches:
      - qa/live-gate5-round2-20260831
  workflow_dispatch:

jobs:
  live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run five fresh live conversations
        shell: bash
        run: |
          python - <<'PY'
          import json, re, sys, time, uuid, urllib.request, urllib.error
          from pathlib import Path

          BASE='https://whatsapp.artos.pe'
          OUT=Path('/tmp/live-gate5-round2.json')

          def get_json(url, timeout=30):
              req=urllib.request.Request(url, headers={'User-Agent':'stech-qa-live-gate2'})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode('utf-8'))

          def post_chat(session_id, idx, message, timeout=100):
              message_id=f'{session_id}-m{idx:02d}-{uuid.uuid4().hex[:8]}'
              payload=json.dumps({'sessionId':session_id,'messageId':message_id,'message':message},ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(BASE+'/api/chat', data=payload, method='POST', headers={'Content-Type':'application/json','User-Agent':'stech-qa-live-gate2'})
              started=time.time()
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      body=json.loads(r.read().decode('utf-8'))
                  return {'ok':True,'messageId':message_id,'elapsed':round(time.time()-started,2),'body':body}
              except Exception as e:
                  return {'ok':False,'messageId':message_id,'elapsed':round(time.time()-started,2),'error':repr(e)}

          def fold(s):
              import unicodedata
              return ''.join(c for c in unicodedata.normalize('NFD',str(s or '').lower()) if unicodedata.category(c)!='Mn')

          def answer(turn):
              return str((turn.get('body') or {}).get('answer') or '')

          def state(turn):
              return (turn.get('body') or {}).get('state') or {}

          def debug(turn):
              return (turn.get('body') or {}).get('debug') or {}

          def active(turn):
              s=state(turn); d=debug(turn)
              return str(s.get('activeProduct') or d.get('activeProduct') or d.get('queryTarget') or '')

          def qcount(text): return str(text).count('?')
          def has_money(text): return bool(re.search(r'\bS\/\s*\d',str(text),re.I))
          def asks_reservation_data(text):
              t=fold(text)
              return bool(re.search(r'\b(dni|carn[eé]?|nombre|apellidos|direccion)\b',t))

          health=get_json(BASE+'/health',20)
          report={'health':health,'runId':'${{ github.run_id }}','conversations':[],'failures':[],'warnings':[]}

          scenarios=[
            {
              'name':'X12_REPARTO_BATERIA',
              'messages':['Dame info del Armor X12 Pro','Lo usaré para reparto durante toda la jornada','Mi celular actual se queda sin batería antes de terminar el trabajo'],
              'expected_active':'Armor X12 Pro'
            },
            {
              'name':'X13_CAMARA_MEMORIA',
              'messages':['¿El Armor X13 tiene cámara nocturna?','La necesito para tomar fotos de noche durante mi trabajo','¿Y cuánta memoria tiene?'],
              'expected_active':'Armor X13'
            },
            {
              'name':'25T_VS_22_CAMPO',
              'messages':['¿El Armor 25T Pro tiene cámara térmica?','Compáralo con el Armor 22 para trabajo de campo','¿Cuál de los dos tiene mejor resistencia?'],
              'expected_pair':['Armor 25T Pro','Armor 22']
            },
            {
              'name':'X13_PRECIO_STOCK_GRACIAS',
              'messages':['¿Cuánto cuesta el Armor X13?','¿Hay stock?','Gracias'],
              'expected_active':'Armor X13',
              'no_price_on_turn':2,
              'no_question_on_turn':3
            },
            {
              'name':'X13_RESERVA_BUNDLE',
              'messages':['Quiero comprar el Armor X13','Prefiero recogerlo en tienda','Sí, quiero reservarlo','DNI: 44556677, Nombre: Rosa Valdez Soto, Dirección: Av. Brasil 123, Lima','Listo'],
              'expected_active':'Armor X13',
              'reservation_final':True
            },
          ]

          for ci,sc in enumerate(scenarios,1):
              session=f'qa-live-r2-{ci}-{uuid.uuid4()}'
              conv={'name':sc['name'],'sessionId':session,'turns':[],'status':'GREEN','reasons':[]}
              print(f'\n=== {ci}/5 {sc["name"]} session={session} ===',flush=True)
              for ti,msg in enumerate(sc['messages'],1):
                  tr=post_chat(session,ti,msg)
                  tr['message']=msg
                  conv['turns'].append(tr)
                  if tr['ok']:
                      a=answer(tr); s=state(tr); d=debug(tr)
                      print(f'T{ti} USER: {msg}',flush=True)
                      print(f'T{ti} BOT : {a}',flush=True)
                      print('STATE:',json.dumps({'activeProduct':s.get('activeProduct'),'queryTarget':s.get('queryTarget'),'comparisonProducts':s.get('comparisonProducts'),'reservationStage':s.get('reservationStage'),'useCase':s.get('useCase'),'problem':s.get('problem'),'pendingCommercialAction':s.get('pendingCommercialAction'),'lastIntent':s.get('lastIntent')},ensure_ascii=False),flush=True)
                      print('DEBUG:',json.dumps({'intent':d.get('intent'),'route':d.get('route'),'nextBestAction':d.get('nextBestAction'),'writer':d.get('writer'),'automation':d.get('automation')},ensure_ascii=False),flush=True)
                  else:
                      conv['status']='RED'; conv['reasons'].append(f'T{ti}_HTTP:{tr.get("error")}')
                      print(f'T{ti} ERROR: {tr.get("error")}',flush=True)
                      break
                  time.sleep(0.8)

              # generic response checks
              for ti,tr in enumerate(conv['turns'],1):
                  if not tr.get('ok'): continue
                  a=answer(tr); fa=fold(a)
                  if not a.strip(): conv['reasons'].append(f'T{ti}_EMPTY_ANSWER')
                  if qcount(a)>1: conv['reasons'].append(f'T{ti}_MULTIPLE_QUESTIONS')
                  if 'lo tienes pensado para' in fa: conv['reasons'].append(f'T{ti}_ROBOTIC_ACK')
                  if 'interrupciones, perdida de tiempo u otro problema' in fa: conv['reasons'].append(f'T{ti}_ROBOTIC_MENU')

              # active-product continuity
              exp=sc.get('expected_active')
              if exp and conv['turns'] and conv['turns'][-1].get('ok'):
                  got=active(conv['turns'][-1])
                  if fold(exp) not in fold(got): conv['reasons'].append(f'ACTIVE_PRODUCT_LOST expected={exp!r} got={got!r}')

              # no unsolicited price in discovery/product-fit scenarios
              if sc['name'] in {'X12_REPARTO_BATERIA','X13_CAMARA_MEMORIA','25T_VS_22_CAMPO'}:
                  for ti,tr in enumerate(conv['turns'],1):
                      if tr.get('ok') and has_money(answer(tr)):
                          conv['reasons'].append(f'T{ti}_UNSOLICITED_PRICE')

              # comparison memory: state pair or answer pair on follow-up
              if sc.get('expected_pair') and conv['turns'] and conv['turns'][-1].get('ok'):
                  last=conv['turns'][-1]; cp=state(last).get('comparisonProducts') or []
                  joined=' '.join(map(str,cp))+' '+answer(last)
                  missing=[p for p in sc['expected_pair'] if fold(p) not in fold(joined)]
                  if missing: conv['reasons'].append('COMPARISON_CONTEXT_LOST:'+','.join(missing))

              if sc.get('no_price_on_turn'):
                  tr=conv['turns'][sc['no_price_on_turn']-1]
                  if tr.get('ok') and has_money(answer(tr)): conv['reasons'].append('STOCK_REPEATED_PRICE')

              if sc.get('no_question_on_turn'):
                  tr=conv['turns'][sc['no_question_on_turn']-1]
                  if tr.get('ok') and qcount(answer(tr))>0: conv['reasons'].append('THANKS_FORCED_QUESTION')

              if sc.get('reservation_final') and len(conv['turns'])>=5 and conv['turns'][-1].get('ok'):
                  last=conv['turns'][-1]; st=str(state(last).get('reservationStage') or '')
                  a=answer(last)
                  if st.startswith('NEED_'): conv['reasons'].append('RESERVATION_RESTARTED:'+st)
                  if asks_reservation_data(a): conv['reasons'].append('RESERVATION_REASKED_DATA')
                  # n8n automation credential errors are reported but do not count as conversational RED here.
                  auto=(debug(last).get('automation') or {})
                  if auto.get('error'): report['warnings'].append({'conversation':sc['name'],'type':'AUTOMATION','error':str(auto.get('error'))})

              if conv['reasons']:
                  conv['status']='RED'
                  report['failures'].append({'conversation':sc['name'],'sessionId':session,'reasons':conv['reasons']})
              report['conversations'].append(conv)
              print('RESULT:',conv['status'],conv['reasons'],flush=True)

          OUT.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('\n=== SUMMARY ===')
          print(json.dumps({'buildId':health.get('buildId'),'green':sum(c['status']=='GREEN' for c in report['conversations']),'red':sum(c['status']=='RED' for c in report['conversations']),'failures':report['failures'],'warnings':report['warnings']},ensure_ascii=False,indent=2))
          if report['failures']:
              sys.exit(1)
          PY
      - name: Upload round2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-live-gate5-round2
          path: /tmp/live-gate5-round2.json
