name: Repository secret scan

on:
  push:
    branches:
      - p0-concurrency-hardening
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run fail-closed secret scan
        shell: bash
        run: |
          set -o pipefail
          python3 tests/security/secret_scan.py . 2>&1 | tee secret-scan.log

      - name: Upload secret scan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-diagnostics
          path: secret-scan.log
          if-no-files-found: ignore
          retention-days: 3
