name: Repository secret scan

on:
  push:
    branches:
      - p0-concurrency-hardening
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run fail-closed secret scan
        shell: bash
        run: python3 tests/security/secret_scan.py .
