name: Apply discovery root fix

on:
  push:
    branches:
      - refactor/canonical-conversation-state
    paths:
      - .github/workflows/_apply-discovery-root-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-conversation-state
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch root causes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          full = Path('backend/src/conversation/commercial/FullRagLlmProvider.ts')
          text = full.read_text(encoding='utf-8')
          old = "  if(/caida|construccion|obra/.test(current))return'En obra una caída pasa en un segundo; conviene que el celular esté hecho para aguantar ese ritmo.';"
          new = "  if(/se me cae|\\bcae\\b|caida|golpe/.test(current))return'Si se te cae seguido, tiene sentido fijarnos primero en qué tan bien aguanta los golpes.';"
          assert old in text, 'currentMessagePain target not found'
          text = text.replace(old, new, 1)
          old = "function shouldForceHumanPainResponse(input:LlmWriteInput,core:string):boolean{\n  const intent=String(input.intent??'').toUpperCase();\n  return Boolean(core)&&painContext(input)&&['EVALUATE_USE','RECOMMEND','RECOMMEND_WITHIN_BUDGET'].includes(intent);\n}"
          new = "function shouldForceHumanPainResponse(input:LlmWriteInput,core:string):boolean{\n  const intent=String(input.intent??'').toUpperCase();\n  const nba=String(input.commercialResponsePlan?.exactNba??input.finalExecutableNba??input.nextBestAction??'').toUpperCase();\n  return Boolean(core)&&nba!=='ASK_MISSING_FACT'&&painContext(input)&&['EVALUATE_USE','RECOMMEND','RECOMMEND_WITHIN_BUDGET'].includes(intent);\n}"
          assert old in text, 'shouldForceHumanPainResponse target not found'
          full.write_text(text.replace(old, new, 1), encoding='utf-8')

          guard = Path('backend/src/conversation/writer/WriterGuard.ts')
          text = guard.read_text(encoding='utf-8')
          old = "  if(!explicitPrice&&!evidenceBoundPrice&&!institutionalPrice&&!sellerLedPrice&&/\\bS\\/\\s*\\d/i.test(answer))return 'UNSOLICITED_PRICE';\n  const unverifiedAction="
          new = "  if(!explicitPrice&&!evidenceBoundPrice&&!institutionalPrice&&!sellerLedPrice&&/\\bS\\/\\s*\\d/i.test(answer))return 'UNSOLICITED_PRICE';\n  const explicitStock=['STOCK','PRICE_AVAILABILITY'].includes(intent);\n  const sellerLedStock=executableNbaForPrice==='SOFT_CLOSE'&&input.commercialResponsePlan?.closePurpose==='FULFILLMENT'&&input.quote?.stock!=null;\n  const availabilityClaim=/\\b(?:tenemos|hay)\\s+(?:stock|disponibilidad)\\b|\\b(?:est[aá]|sigue)\\s+disponible\\b|\\bno\\s+(?:est[aá]\\s+)?disponible\\b|\\bsin\\s+stock\\b/i;\n  if(!explicitStock&&!sellerLedStock&&availabilityClaim.test(answer))return 'UNSOLICITED_AVAILABILITY';\n  const unverifiedAction="
          assert old in text, 'WriterGuard price guard target not found'
          guard.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Verify focused discovery regressions
        working-directory: backend
        run: node --experimental-strip-types --test tests/unit/discovery-root-regressions.test.ts tests/unit/commercial-salesperson-regressions.test.ts
      - name: Commit root fix
        shell: bash
        run: |
          git rm .github/workflows/_apply-discovery-root-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/conversation/commercial/FullRagLlmProvider.ts backend/src/conversation/writer/WriterGuard.ts
          git commit -m "fix: enforce discovery response boundaries"
          git push origin HEAD:refactor/canonical-conversation-state
