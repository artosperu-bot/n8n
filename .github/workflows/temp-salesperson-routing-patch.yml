name: Temporary salesperson routing patch

on:
  push:
    branches:
      - feat/crm-automation-engine
    paths:
      - '.github/workflows/temp-salesperson-routing-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-automation-engine
      - name: Patch objection routing and stale regression
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old,new))

          # Keep generic objections generic. Price objections get their own
          # deterministic intent and therefore their own LAER/alternative path.
          replace('backend/src/conversation/HybridConversationEngine.ts',
                  "  if (intent === 'OBJECTION') return 'HANDLE_PRICE_OBJECTION';\n", '')
          replace('backend/src/conversation/HybridConversationEngine.ts',
                  "  if (intent === 'HANDLE_PRICE_OBJECTION') return 'OBJECION';",
                  "  if (['OBJECTION','HANDLE_PRICE_OBJECTION'].includes(intent)) return 'OBJECION';")
          replace('backend/src/conversation/HybridConversationEngine.ts',
                  "  if (intent === 'HANDLE_PRICE_OBJECTION') return 'LAER';",
                  "  if (['OBJECTION','HANDLE_PRICE_OBJECTION'].includes(intent)) return 'LAER';")
          replace('backend/src/conversation/HybridConversationEngine.ts',
                  "needsProductRag:['PRODUCT_INFO','CAPABILITY','COMPARE','RECOMMEND','RECOMMEND_WITHIN_BUDGET','EVALUATE_USE','HANDLE_PRICE_OBJECTION'].includes(intent)",
                  "needsProductRag:['PRODUCT_INFO','CAPABILITY','COMPARE','RECOMMEND','RECOMMEND_WITHIN_BUDGET','EVALUATE_USE','OBJECTION','HANDLE_PRICE_OBJECTION'].includes(intent)")
          replace('backend/src/conversation/HybridConversationEngine.ts',
                  "['PRODUCT_INFO','CAPABILITY','EVALUATE_USE','RECOMMEND','RECOMMEND_WITHIN_BUDGET','HANDLE_PRICE_OBJECTION'].includes(intent)",
                  "['PRODUCT_INFO','CAPABILITY','EVALUATE_USE','RECOMMEND','RECOMMEND_WITHIN_BUDGET','OBJECTION','HANDLE_PRICE_OBJECTION'].includes(intent)")

          # Deterministic intent distinguishes price objections from generic
          # objections before the planner is allowed to influence the turn.
          replace('backend/src/conversation/intent/IntentPlan.ts',
                  "| 'ORDER_STATUS' | 'OBJECTION' | 'HUMAN' | 'PURCHASE' | 'QUOTE' | 'CATALOG'",
                  "| 'ORDER_STATUS' | 'OBJECTION' | 'HANDLE_PRICE_OBJECTION' | 'HUMAN' | 'PURCHASE' | 'QUOTE' | 'CATALOG'")
          replace('backend/src/conversation/intent/IntentPlan.ts',
                  "  if (has(/\\b(caro|sale de mi presupuesto|fuera de mi presupuesto|no confio|me preocupa|esperaba|descuento|otra tienda[^.!?]{0,60}(?:barato|economico)|mas barato)\\b/)) hits.push('OBJECTION');",
                  "  if (has(/\\b(caro|sale de mi presupuesto|fuera de mi presupuesto|descuento|otra tienda[^.!?]{0,60}(?:barato|economico)|mas barato)\\b/)) hits.push('HANDLE_PRICE_OBJECTION');\n  if (has(/\\b(no confio|me preocupa|esperaba|se me hace (?:muy )?(?:grande|pesado|grueso))\\b/)) hits.push('OBJECTION');")
          replace('backend/src/conversation/intent/IntentPlan.ts',
                  "'PRODUCT_INFO','OBJECTION','HUMAN','OTHER']",
                  "'PRODUCT_INFO','HANDLE_PRICE_OBJECTION','OBJECTION','HUMAN','OTHER']")
          replace('backend/src/conversation/intent/IntentPlan.ts',
                  "'POLICY','PRODUCT_INFO','OBJECTION','EVALUATE_USE'",
                  "'POLICY','PRODUCT_INFO','HANDLE_PRICE_OBJECTION','OBJECTION','EVALUATE_USE'")

          # If the planner and deterministic path disagree only about objection
          # subtype, the current deterministic customer message wins.
          replace('backend/src/conversation/decision/DecisionValidator.ts',
                  "  let primaryIntent=plannerIntent??fallbackIntent??'OTHER';\n\n  if(fallbackIntent&&['PURCHASE','HUMAN','QUOTE'].includes(fallbackIntent))primaryIntent=fallbackIntent;",
                  "  let primaryIntent=plannerIntent??fallbackIntent??'OTHER';\n\n  if(fallbackIntent&&['OBJECTION','HANDLE_PRICE_OBJECTION'].includes(fallbackIntent)&&['OBJECTION','HANDLE_PRICE_OBJECTION'].includes(primaryIntent))primaryIntent=fallbackIntent;\n  if(fallbackIntent&&['PURCHASE','HUMAN','QUOTE'].includes(fallbackIntent))primaryIntent=fallbackIntent;")

          # Replace the stale test that encoded the old mechanical SPIN rule.
          replace('backend/tests/unit/commercial-spin-n1-regressions.test.ts',
          """test('recommendation can use one SPIN discovery N+1 before enough context exists',()=>{\n  assert.equal(nextBestAction('RECOMMEND',{priorities:['resistencia','bateria']}),'ASK_MISSING_FACT');\n  assert.equal(isNbaCompatible('RECOMMEND','ASK_MISSING_FACT',{}),true);\n  const prepared=prepareCommercialWriteInput({\n    message:'Busco uno resistente y con buena batería, ¿qué me recomiendas?',intent:'RECOMMEND',\n    state:{priorities:['resistencia','bateria']},decision:{nextBestAction:'ASK_MISSING_FACT'} as any,\n    allowedProducts:[],\n  });\n  assert.equal(prepared.nextBestAction,'ASK_MISSING_FACT');\n  assert.equal(prepared.missingFact,'uso principal');\n});""",
          """test('recommendation skips redundant SPIN when substantive criteria are already explicit',()=>{\n  assert.equal(nextBestAction('RECOMMEND',{priorities:['resistencia','bateria']}),'ANSWER_ONLY');\n  assert.equal(isNbaCompatible('RECOMMEND','ANSWER_ONLY',{}),true);\n  const prepared=prepareCommercialWriteInput({\n    message:'Busco uno resistente y con buena batería, ¿qué me recomiendas?',intent:'RECOMMEND',\n    state:{priorities:['resistencia','bateria']},decision:{nextBestAction:'ANSWER_ONLY'} as any,\n    allowedProducts:[],\n  });\n  assert.equal(prepared.nextBestAction,'ANSWER_ONLY');\n  assert.equal(prepared.missingFact,null);\n});""")
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/conversation/HybridConversationEngine.ts backend/src/conversation/intent/IntentPlan.ts backend/src/conversation/decision/DecisionValidator.ts backend/tests/unit/commercial-spin-n1-regressions.test.ts
          git commit -m 'fix: distinguish generic and price objections'
          git push origin HEAD:feat/crm-automation-engine
