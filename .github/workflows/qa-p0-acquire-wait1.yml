name: QA P0 acquire wait1 via n8n

on:
  push:
    branches:
      - p0-concurrency-hardening
    paths:
      - .github/workflows/qa-p0-acquire-wait1.yml
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger n8n owner with explicit QA acquire contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST 'https://stechsito.app.n8n.cloud/webhook/qa-p0-120-owner-api' \
            -H 'Content-Type: application/json' \
            --data '{"source":"github-actions","test":"p0_acquire_wait1","session_id":"qa_probe_n8n_wait1_20260812_2205","message_id":"qa_msg_n8n_wait1_20260812_2205","owner":"qa_owner_n8n_wait1_20260812_2205","p_ttl_seconds":120,"p_wait_seconds":1}'
          echo 'n8n owner webhook accepted explicit wait1 payload.'
