name: Align Gate5 Tests 2

on:
  push:
    branches:
      - qa/align-gate5-tests2-20260831

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-conversation-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Patch obsolete expectations
        shell: python
        run: |
          from pathlib import Path

          p=Path('backend/tests/unit/post-answer-commercial-progression.test.ts')
          s=p.read_text(encoding='utf-8')
          start=s.index("test('stock keeps RELATED_VALUE and selects a price-supported continuation without exposing the price'")
          end=s.index("\n});",start)+4
          new=(
            "test('stock answers availability only and does not select price as a related continuation',()=>{\n"
            "  const quote={product:'Producto Prueba',shortName:'Producto Prueba',price:899,stock:3,currency:'PEN',source:'FAKE_TEST_DATA'};\n"
            "  const prepared=prepareCommercialWriteInput({\n"
            "    message:'¿tienen stock?',intent:'STOCK',state:{activeProduct:'Producto Prueba'},\n"
            "    decision:{nextBestAction:'RELATED_VALUE'} as any,allowedProducts:['Producto Prueba'],quote,\n"
            "  });\n"
            "  assert.equal(prepared.nextBestAction,'ANSWER_ONLY');\n"
            "  assert.equal(prepared.commercialMove,null);\n"
            "  const answer=stockResponse(quote,null,false,null);\n"
            "  assert.match(answer,/disponible/i);\n"
            "  assert.doesNotMatch(answer,/precio|899/i);\n"
            "});"
          )
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')

          p=Path('backend/tests/unit/commercial-spin-n1-regressions.test.ts')
          s=p.read_text(encoding='utf-8')
          old="  assert.match(result.answer,/genera|interrupciones|p[eé]rdida de tiempo/i);\n  assert.equal((result.answer.match(/\\?/g)??[]).length,1);"
          new="  assert.match(result.answer,/afecta|genera|ocasiona|impacta|complica/i);\n  assert.doesNotMatch(result.answer,/:|\\bu otro\\b|interrupciones,|p[eé]rdida de tiempo u/i);\n  assert.equal((result.answer.match(/\\?/g)??[]).length,1);"
          if old not in s: raise SystemExit('old spin assertion not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Verify affected tests
        working-directory: backend
        run: node --experimental-strip-types --test tests/unit/post-answer-commercial-progression.test.ts tests/unit/commercial-spin-n1-regressions.test.ts tests/unit/live-gate5-writer-regressions.test.ts tests/unit/live-gate5-grounded-followup.test.ts tests/unit/live-gate5-reservation-ready.test.ts
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Commit and push canonical
        run: |
          git config user.name "artosperu-bot"
          git config user.email "artosperu@gmail.com"
          git add backend/tests/unit/post-answer-commercial-progression.test.ts backend/tests/unit/commercial-spin-n1-regressions.test.ts
          git commit -m "test: align live gate commercial expectations"
          git push origin HEAD:refactor/canonical-conversation-state
