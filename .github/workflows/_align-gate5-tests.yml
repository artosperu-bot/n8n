name: Align Gate5 Legacy Tests

on:
  push:
    branches:
      - qa/align-gate5-tests-20260831
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-conversation-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Align two obsolete expectations
        shell: python
        run: |
          from pathlib import Path

          p=Path('backend/tests/unit/post-answer-commercial-progression.test.ts')
          s=p.read_text(encoding='utf-8')
          old="""test('stock keeps RELATED_VALUE and selects a price-supported continuation without exposing the price',()=>{
  const quote={product:'Producto Prueba',shortName:'Producto Prueba',price:899,stock:3,currency:'PEN',source:'FAKE_TEST_DATA'};
  const prepared=prepareCommercialWriteInput({
    message:'¿tienen stock?',intent:'STOCK',state:{activeProduct:'Producto Prueba'},
    decision:{nextBestAction:'RELATED_VALUE'} as any,allowedProducts:['Producto Prueba'],quote,
  });
  assert.equal(prepared.nextBestAction,'RELATED_VALUE');
  assert.equal(prepared.commercialMove?.kind,'RELATED_VERIFIED_FACT');
  assert.ok(prepared.commercialMove?.verifiedFacts.some(fact=>fact.key==='PRECIO'));
  const answer=stockResponse(quote,null,false,prepared.commercialMove??null);
  assert.match(answer,/disponible/i);
  assert.match(answer,/precio/i);
  assert.doesNotMatch(answer,/899/);
});"""
          new="""test('stock answers availability only and does not select price as a related continuation',()=>{
  const quote={product:'Producto Prueba',shortName:'Producto Prueba',price:899,stock:3,currency:'PEN',source:'FAKE_TEST_DATA'};
  const prepared=prepareCommercialWriteInput({
    message:'¿tienen stock?',intent:'STOCK',state:{activeProduct:'Producto Prueba'},
    decision:{nextBestAction:'RELATED_VALUE'} as any,allowedProducts:['Producto Prueba'],quote,
  });
  assert.equal(prepared.nextBestAction,'ANSWER_ONLY');
  assert.equal(prepared.commercialMove,null);
  const answer=stockResponse(quote,null,false,null);
  assert.match(answer,/disponible/i);
  assert.doesNotMatch(answer,/precio|899/i);
});"""
          if old not in s: raise SystemExit('stock legacy expectation not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('backend/tests/unit/commercial-spin-n1-regressions.test.ts')
          s=p.read_text(encoding='utf-8')
          old="""  assert.match(result.answer,/genera|interrupciones|p[eé]rdida de tiempo/i);
  assert.equal((result.answer.match(/\\?/g)??[]).length,1);"""
          new="""  assert.match(result.answer,/afecta|genera|ocasiona|impacta|complica/i);
  assert.doesNotMatch(result.answer,/:|\\bu otro\\b|interrupciones,|p[eé]rdida de tiempo u/i);
  assert.equal((result.answer.match(/\\?/g)??[]).length,1);"""
          if old not in s: raise SystemExit('SPIN menu legacy expectation not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Verify affected tests
        working-directory: backend
        run: |
          node --experimental-strip-types --test \
            tests/unit/post-answer-commercial-progression.test.ts \
            tests/unit/commercial-spin-n1-regressions.test.ts \
            tests/unit/live-gate5-writer-regressions.test.ts \
            tests/unit/live-gate5-grounded-followup.test.ts \
            tests/unit/live-gate5-reservation-ready.test.ts
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Commit and push canonical
        run: |
          git config user.name "artosperu-bot"
          git config user.email "artosperu@gmail.com"
          git add backend/tests/unit/post-answer-commercial-progression.test.ts backend/tests/unit/commercial-spin-n1-regressions.test.ts
          git commit -m "test: align live gate commercial expectations"
          git push origin HEAD:refactor/canonical-conversation-state
