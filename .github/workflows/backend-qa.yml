name: Backend QA

on:
  push:
    branches:
      - feat/stech-backend
    paths:
      - 'backend/**'
      - '.github/workflows/backend-qa.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-qa.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Test
        working-directory: backend
        run: npm test
      - name: Build check
        working-directory: backend
        run: npm run build
