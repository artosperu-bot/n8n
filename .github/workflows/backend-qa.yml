name: Backend QA

on:
  push:
    branches:
      - feat/stech-backend
    paths:
      - 'backend/**'
      - '.github/workflows/backend-qa.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-qa.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Sync generated package lock
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- backend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/package-lock.json
            git commit -m "chore: sync backend package lock"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Test
        working-directory: backend
        run: |
          set -o pipefail
          npm test 2>&1 | tee qa-test.log
      - name: Build check
        if: always()
        working-directory: backend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee qa-build.log
      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-qa-diagnostics
          path: |
            backend/qa-test.log
            backend/qa-build.log
          if-no-files-found: ignore
          retention-days: 3
