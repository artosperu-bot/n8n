name: Backend QA

on:
  push:
    branches:
      - feat/stech-backend
      - feat/crm-automation-engine
    paths:
      - 'backend/**'
      - '.github/workflows/backend-qa.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-qa.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: backend
        run: |
          set -o pipefail
          npm test 2>&1 | tee qa-test.log
      - name: Build check
        if: always()
        working-directory: backend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee qa-build.log
      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-qa-diagnostics
          path: |
            backend/qa-test.log
            backend/qa-build.log
          if-no-files-found: ignore
          retention-days: 3
